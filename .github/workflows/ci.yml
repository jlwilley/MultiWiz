name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build, test and publish
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MultiWiz.slnx

      - name: Build
        run: dotnet build MultiWiz.slnx -c Release --no-restore

      # global.json selects Microsoft.Testing.Platform, so tests take --solution and xunit's report switches directly.
      - name: Test
        run: dotnet test --solution MultiWiz.slnx -c Release --no-build --report-xunit-trx --results-directory "$env:GITHUB_WORKSPACE\TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish app (win-x64, self-contained)
        run: dotnet publish src/MultiWiz.App/MultiWiz.App.csproj -c Release -r win-x64 --self-contained -o publish

      # Starts the published app in its hidden smoke-test mode: it opens every page, window and dialog against a
      # throwaway data folder and exits 0 only if nothing threw. Catches runtime-only failures (XAML resources,
      # DI resolution, startup crashes) that the build and unit tests cannot see.
      - name: Smoke test (launch the real app)
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'smoke-result.txt'
          $stdout = Join-Path $env:RUNNER_TEMP 'smoke-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt'
          # The app puts its throwaway data folder under %TMP%; keep it where the failure upload looks.
          $env:TMP = $env:RUNNER_TEMP
          $env:TEMP = $env:RUNNER_TEMP
          $process = Start-Process -FilePath 'publish\MultiWiz.exe' `
            -ArgumentList @('--smoke-test', '--smoke-test-result', "`"$result`"") `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          # The app has its own 90 s watchdog; this is the backstop if the process itself hangs.
          if (-not $process.WaitForExit(150000)) {
            $process.Kill($true)
            Write-Output '::error title=Smoke test hung::MultiWiz did not exit within 150 seconds.'
          }
          $process.WaitForExit()
          Write-Output '--- stdout ---'; Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Output '--- stderr ---'; Get-Content $stderr -ErrorAction SilentlyContinue
          $text = if (Test-Path $result) { (Get-Content $result -Raw).Trim() } else { '<no result file>' }
          Write-Output "--- result (exit code $($process.ExitCode)) ---"; Write-Output $text
          if ($process.ExitCode -ne 0 -or $text -ne 'OK') {
            Write-Output '::error title=Smoke test failed::MultiWiz failed its startup smoke test; see the log above.'
            exit 1
          }

      - name: Upload smoke test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output
          path: |
            ${{ runner.temp }}/smoke-*.txt
            ${{ runner.temp }}/MultiWiz-smoke-*/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload app build
        uses: actions/upload-artifact@v7
        with:
          name: MultiWiz-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7
