name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build, test and publish
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MultiWiz.slnx

      - name: Build
        run: dotnet build MultiWiz.slnx -c Release --no-restore

      # global.json selects Microsoft.Testing.Platform, so tests take --solution and xunit's report switches directly.
      - name: Test
        run: dotnet test --solution MultiWiz.slnx -c Release --no-build --report-xunit-trx --results-directory "$env:GITHUB_WORKSPACE\TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish app (win-x64, self-contained)
        run: dotnet publish src/MultiWiz.App/MultiWiz.App.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Upload app build
        uses: actions/upload-artifact@v7
        with:
          name: MultiWiz-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7
