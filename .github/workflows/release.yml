name: Build and Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish MultiWiz\MultiWiz.csproj --configuration Release --output ./publish --no-build

    - name: Install Velopack
      run: dotnet tool install -g vpk

    - name: Get version from project
      id: get_version
      shell: pwsh
      run: |
        [xml]$csproj = Get-Content MultiWiz\MultiWiz.csproj
        $version = $csproj.Project.PropertyGroup.Version
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"

    - name: Package with Velopack
      run: |
        vpk pack --packId MultiWiz --packVersion ${{ steps.get_version.outputs.VERSION }} --packDir ./publish --mainExe MultiWiz.exe --outputDir ./Deployment/VelopackReleases

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: MultiWiz v${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          ./Deployment/VelopackReleases/*.zip
          ./Deployment/VelopackReleases/*.exe
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
